<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mundo Velas - Log In</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <header>
        <nav>
            <ul>
                <li><a href="#">Candles</a></li>
                <li><a href="#">Essence</a></li>
                <li><a href="#">Gift Sets</a></li>
                <li><a href="#">Mission and Goals</a></li>
                <li><a href="#">About Us</a></li>
            </ul>
        </nav>
        <h1>MUNDO VELAS</h1>
        <div class="nav-icons">
            <a href="#"><i class="search-icon">🔍</i></a>
            <a href="#"><i class="user-icon">👤</i></a>
            <a href="#"><i class="cart-icon">🛒</i></a>
        </div>
    </header>

    <main>
        <h2>LOG IN</h2>
        <form action="#" method="post">
            <div class="login-section">
                <label for="email">Email Address *</label>
                <input type="email" id="email" name="email" required>
                
                <label for="password">Password *</label>
                <input type="password" id="password" name="password" required>

                <div class="options">
                    <a href="#">Forgot your password?</a>
                    <label>
                        <input type="checkbox" name="remember">
                        Remember me
                    </label>
                </div>
                
                <button type="submit">LOG IN</button>
            </div>
        </form>

        <div class="social-login">
            <span>or</span>
            <button class="google">Google</button>
            <button class="apple">Apple</button>
        </div>
    </main>
</body>
</html>
