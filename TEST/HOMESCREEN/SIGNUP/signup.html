<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mundo Velas - Registro</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <header>
        <div class="logo">MUNDO VELAS</div>
        <nav>
            <ul>
                <li><a href="#">CANDLES</a></li>
                <li><a href="#">ESSENCE</a></li>
                <li><a href="#">GIFT SETS</a></li>
                <li><a href="#">MISSION AND GOALS</a></li>
                <li><a href="#">ABOUT US</a></li>
            </ul>
        </nav>
        <div class="icons">
            <span class="icon-search"></span>
            <span class="icon-user"></span>
            <span class="icon-cart"></span>
        </div>
    </header>
    
    <main>
        <h1>SIGN UP</h1>
        <div class="signup-container">
            <form class="signup-form">
                <div class="personal-info">
                    <h2>PERSONAL INFORMATION</h2>
                    <p>Use only latin characters (A-Z) to fill out the fields below.</p>
                    <label for="title">Title *</label>
                    <select id="title" name="title" required>
                        <option value="">Select Title</option>
                        <option value="mr">Mr</option>
                        <option value="mrs">Mrs</option>
                        <option value="ms">Ms</option>
                    </select>
                    
                    <label for="first-name">First Name *</label>
                    <input type="text" id="first-name" name="first-name" required>
                    
                    <label for="last-name">Last Name *</label>
                    <input type="text" id="last-name" name="last-name" required>
                    
                    <label for="dob">Date of Birth (dd/mm/yyyy)</label>
                    <input type="date" id="dob" name="dob">
                    
                    <label for="phone-prefix">Prefix *</label>
                    <select id="country-code" name="country-code" required>
                        <option value="" disabled selected>Select a country</option>
                        <option value="AT +43">Austria (+43)</option>
                        <option value="CO +57">Colombia (+57)</option>
                        <option value="US +1">United States (+1)</option>
                        <option value="CA +1">Canada (+1)</option>
                        <option value="MX +52">Mexico (+52)</option>
                        <option value="AR +54">Argentina (+54)</option>
                        <option value="BR +55">Brazil (+55)</option>
                        <option value="GB +44">United Kingdom (+44)</option>
                        <option value="FR +33">France (+33)</option>
                        <option value="DE +49">Germany (+49)</option>
                        <option value="ES +34">Spain (+34)</option>
                        <option value="IT +39">Italy (+39)</option>
                        <!-- Añadir más opciones de prefijo -->
                    </select>
                    <input type="tel" id="phone" name="phone" placeholder="Mobile Phone">
                    
                    <label for="email">Email *</label>
                    <input type="email" id="email" name="email" required>
                </div>
                
                <div class="login-info">
                    <h2>LOGIN INFORMATION</h2>
                    
                    <label for="password">Password *</label>
                    <input type="password" id="password" name="password" required>
                    
                    <label for="confirm-password">Confirm Password *</label>
                    <input type="password" id="confirm-password" name="confirm-password" required>
                    
                    <button type="submit" class="btn-register">REGISTER</button>
                    
                    <div class="or-divider">or</div>
                    
                    <div class="social-signup">
                        <button class="btn-google">Google</button>
                        <button class="btn-apple">Apple</button>
                    </div>
                </div>
            </form>
        </div>
    </main>

    <footer>
        <p>&copy; 2024 Mundo Velas. Todos los derechos reservados.</p>
    </footer>
</body>
</html>
