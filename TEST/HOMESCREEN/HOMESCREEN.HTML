<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mundo Velas</title>
    <link rel="stylesheet" href="STYLES.CSS">
</head>
<body>
    <!-- Header -->
    <header>
        <div class="logo-container">
            <img src="ruta-del-logo.png" alt="Logo Mundo Velas" class="logo">
            <h1 class="store-name">MUNDO VELAS</h1>
        </div>
        <nav>
            <ul class="nav-menu">
                <li><a href="#candles">Candles</a></li>
                <li><a href="#essence">Essence</a></li>
                <li><a href="#giftsets">Gift Sets</a></li>
                <li><a href="#mission">Mission and Goals</a></li>
                <li><a href="#about">About Us</a></li>
            </ul>
        </nav>
        <div class="user-icon">
            <img src="ruta-del-icono-perfil.png" alt="User Profile">
        </div>
    </header>

    <!-- Main Image -->
    <section class="hero-section">
        <img src="ruta-de-la-imagen-principal.png" alt="Main Image" class="hero-image">
    </section>

    <!-- Featured Products -->
    <section class="featured-products">
        <h2>Our Signature Candles</h2>
        <div class="products-grid">
            <div class="product-item">
                <img src="product1.png" alt="Product 1">
                <p>Lime Basil & Mandarin</p>
            </div>
            <div class="product-item">
                <img src="product2.png" alt="Product 2">
                <p>English Pear & Freesia</p>
            </div>
            <div class="product-item">
                <img src="product3.png" alt="Product 3">
                <p>Pomegranate Noir</p>
            </div>
            <div class="product-item">
                <img src="product4.png" alt="Product 4">
                <p>Wood Sage & Sea Salt</p>
            </div>
            <div class="product-item">
                <img src="product5.png" alt="Product 5">
                <p>Luce di Colonia</p>
            </div>
            <div class="product-item">
                <img src="product6.png" alt="Product 6">
                <p>Oh L'Amore</p>
            </div>
            <div class="product-item">
                <img src="product7.png" alt="Product 7">
                <p>Colonia Candle</p>
            </div>
            <div class="product-item">
                <img src="product8.png" alt="Product 8">
                <p>Grazie Candle</p>
            </div>
        </div>
    </section>
</body>
</html>
