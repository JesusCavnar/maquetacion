<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <script type="module" src="../js/login.js"></script>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mundo Velas</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    
    <style>
        .bg-red {
            background-color: #ff0000; /* Color rojo */
        }
        .navbar-nav .nav-link {
            margin-right: 20px; /* Espaciado entre las opciones del Navbar */
        }
        .navbar-brand-custom {
            margin-left: 42%; /* Ajuste de centrado para el título */
        }
        body {
            background-color: #f8f9fa; /* Fondo claro */
            display: flex;
            flex-direction: column;
            min-height: 100vh;
        }
        .content {
            flex: 1; /* Permite que el contenido se centre verticalmente */
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
        }
        .login-container {
            background-color: white;
            padding: 20px;
            border-radius: 10px;
            box-shadow: 0px 4px 6px rgba(0, 0, 0, 0.1);
            width: 100%;
            max-width: 400px;
        }
        .login-container h2 {
            text-align: center;
            margin-bottom: 20px;
            color: #ff0000; /* Color rojo para resaltar */
        }
        .form-control:focus {
            border-color: #ff0000;
            box-shadow: 0 0 5px rgba(255, 0, 0, 0.5);
        }
        .btn-primary {
            background-color: #ff0000;
            border-color: #ff0000;
        }
        .btn-primary:hover {
            background-color: #cc0000;
            border-color: #cc0000;
        }
        .social-buttons {
            margin-top: 15px; /* Separación con el botón de Sign In */
        }
        .social-buttons .btn {
            font-size: 0.9rem; /* Tamaño del texto reducido */
            height: 45px; /* Altura reducida */
        }
        .social-buttons .btn-google {
            background-color: #4285F4;
            color: white;
        }
        .social-buttons .btn-google:hover {
            background-color: #357ae8;
        }
        .social-buttons .btn-apple {
            background-color: #000;
            color: white;
        }
        .social-buttons .btn-apple:hover {
            background-color: #333;
        }
        .btn-spacing {
            margin-top: 10px; /* Espaciado entre los botones */
        }
    </style>
</head>
<body>

    <!-- Navbar superior -->
    <nav class="navbar bg-red">
        <div class="container-fluid d-flex justify-content-between align-items-center">
          <a class="navbar-brand navbar-brand-custom d-flex align-items-center" href="#">
            <img src="ruta-del-logo.png" alt="Logo" width="34" height="40" class="d-inline-block align-text-top me-2">
            <span class="text-center">Mundo Velas</span>
          </a>
          <a class="navbar-brand ms-auto" href="#"><img src="ruta-del-icono-perfil.png" alt="Profile" width="30" height="30"></a>
        </div>
    </nav>

    <!-- Navbar inferior -->
    <nav class="navbar navbar-expand-lg bg-body-tertiary">
        <div class="container-fluid">
          <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarNavAltMarkup" aria-controls="navbarNavAltMarkup" aria-expanded="false" aria-label="Toggle navigation">
            <span class="navbar-toggler-icon"></span>
          </button>
          <div class="collapse navbar-collapse justify-content-center" id="navbarNavAltMarkup">
            <div class="navbar-nav">
              <a class="nav-link" href="#">Home</a>
              <a class="nav-link" href="#">Candles</a>
              <a class="nav-link" href="#">Essence</a>
              <a class="nav-link" href="#">Gift Sets</a>
              <a class="nav-link" href="#">Mission and Goals</a>
              <a class="nav-link" href="#">About Us</a>
            </div>
          </div>
        </div>
    </nav>

    <!-- Contenido principal con el formulario -->
    <div class="content">
        <div class="login-container">
            <h2>Sign In</h2>
            <form id="loginForm">
                <div class="mb-3">
                    <label for="email" class="form-label">Email address</label>
                    <input type="email" class="form-control" id="email" placeholder="Enter your email" required>
                </div>
                <div class="mb-3">
                    <label for="password" class="form-label">Password</label>
                    <input type="password" class="form-control" id="password" placeholder="Enter your password" required>
                </div>
                <button type="submit" class="btn btn-primary w-100">Sign In</button>
            </form>
            <script src="js/login.js"></script>
            

            <!-- Botones sociales -->
            <div class="social-buttons text-center btn-spacing">
                <button type="button" class="btn btn-google w-100 mb-2">Sign in with Google</button>
                <button type="button" class="btn btn-apple w-100">Sign in with Apple</button>
            </div>
        </div>
    </div>

    <script>
        // Validación e interactividad del formulario
        document.getElementById('loginForm').addEventListener('submit', function(event) {
            event.preventDefault(); // Evita el envío por defecto

            const emailInput = document.getElementById('email');
            const passwordInput = document.getElementById('password');
            let isValid = true;

            // Validar email
            if (!emailInput.value.includes('@') || !emailInput.value.includes('.')) {
                emailInput.classList.add('is-invalid');
                isValid = false;
            } else {
                emailInput.classList.remove('is-invalid');
            }

            // Validar contraseña
            if (passwordInput.value.length < 6) {
                passwordInput.classList.add('is-invalid');
                isValid = false;
            } else {
                passwordInput.classList.remove('is-invalid');
            }

            // Si todo es válido, mostrar mensaje de éxito
            if (isValid) {
                alert('Login successful!');
                // Aquí puedes redirigir o realizar una acción específica
            }
        });
    </script>

</body>
</html>
