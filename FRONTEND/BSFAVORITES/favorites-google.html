<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Favorites - Mundo Velas</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        .favorites-container {
            max-width: 800px;
            margin: 0 auto;
            padding: 20px;
        }
        .favorites-container h2 {
            text-align: center;
            margin-bottom: 20px;
        }
        .product-card {
            border: 1px solid #ddd;
            border-radius: 8px;
            padding: 15px;
            margin-bottom: 15px;
            background-color: #f9f9f9;
            display: flex;
            align-items: center;
            transition: transform 0.2s;
        }
        .product-card:hover {
            transform: translateY(-3px);
            box-shadow: 0 4px 8px rgba(0,0,0,0.1);
        }
        .product-image {
            width: 100px;
            height: 100px;
            object-fit: cover;
            border-radius: 8px;
            margin-right: 20px;
        }
        .product-info {
            flex-grow: 1;
        }
        .bg-red {
            background-color: #ff0000;
        }
        .navbar-nav .nav-link {
            margin-right: 20px;
        }
        .navbar-brand-custom {
            margin-left: 43%;
        }
        .empty-favorites {
            text-align: center;
            padding: 40px;
            color: #666;
            display: none;
        }
        .loading-spinner {
            display: none;
            text-align: center;
            padding: 20px;
        }
        .auth-message {
            text-align: center;
            padding: 40px;
            display: none;
        }
    </style>
</head>
<body>
    <!-- Navbar superior -->
    <nav class="navbar bg-red">
        <div class="container-fluid d-flex justify-content-between align-items-center">
            <a class="navbar-brand navbar-brand-custom d-flex align-items-center" href="../index.html">
                <img src="ruta-del-logo.png" alt="Logo" width="34" height="40" class="d-inline-block align-text-top me-2">
                <span class="text-center">Mundo Velas</span>
            </a>
            <a class="navbar-brand ms-auto profile-link" href="#">
                <img src="ruta-del-icono-perfil.png" alt="Profile" width="30" height="30">
            </a>
        </div>
    </nav>
    
    <!-- Navbar inferior -->
    <nav class="navbar navbar-expand-lg bg-body-tertiary">
        <div class="container-fluid">
            <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarNavAltMarkup" aria-label="Toggle navigation">
                <span class="navbar-toggler-icon"></span>
            </button>
            <div class="collapse navbar-collapse justify-content-center" id="navbarNavAltMarkup">
                <div class="navbar-nav">
                    <a class="nav-link home-nav-link" href="../BSHOMEGOOGLE/index.html">Home</a>
                    <a class="nav-link profile-nav-link" href="#">My Profile</a>
                    <a class="nav-link active" href="../BSFAVORITES/favorites.html">Favorites</a>
                </div>
            </div>
        </div>
    </nav>

    <!-- Favorites Content -->
    <div class="favorites-container">
        <h2>My Favorites</h2>
        
        <!-- Loading State -->
        <div id="loading-spinner" class="loading-spinner">
            <div class="spinner-border text-primary" role="status">
                <span class="visually-hidden">Loading...</span>
            </div>
            <p class="mt-2">Loading your favorites...</p>
        </div>
        
        <!-- Auth Message -->
        <div id="auth-message" class="auth-message">
            <i class="fas fa-exclamation-circle fa-3x mb-3 text-warning"></i>
            <p>Please sign in to view your favorites</p>
            <a href="../BSLOGIN/index.html" class="btn btn-primary mt-3">Sign In</a>
        </div>
        
        <div id="empty-favorites" class="empty-favorites">
            <i class="far fa-heart fa-3x mb-3"></i>
            <p>Your favorites list is empty</p>
            <a href="../index.html" class="btn btn-outline-primary mt-3">Browse Products</a>
        </div>
        </div>
        
        <!-- Favorites List -->
        <div id="favorites-list" class="row">
            <!-- Dynamically populated -->
        </div>
    </div>

    <!-- Firebase App -->
    <script type="module">
        import { auth, db, getOrCreateGoogleUserProfile } from '../firebase.js';
        import { 
            collection, 
            query, 
            where, 
            getDocs, 
            doc, 
            deleteDoc,
            onSnapshot 
        } from "https://www.gstatic.com/firebasejs/9.6.0/firebase-firestore.js";
        import { onAuthStateChanged } from "https://www.gstatic.com/firebasejs/9.6.0/firebase-auth.js";

   
    </script>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
    <script src="../js/favorites.js" type="module"></script>
</body>
</html>
