<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Resultado del Pago - Mundo Velas</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        .bg-red { background-color: #ff0000; }
        .navbar-brand-custom { margin-left: 43%; }
        .brand-text-black { color: black; }
        .result-card {
            max-width: 600px;
            margin: 50px auto;
            background: white;
            padding: 40px;
            border-radius: 15px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.1);
            text-align: center;
        }
        .icon-success { color: #28a745; font-size: 5rem; margin-bottom: 20px; }
        .icon-error { color: #dc3545; font-size: 5rem; margin-bottom: 20px; }
    </style>
</head>
<body class="bg-light">

    <!-- Navbar superior -->
    <nav class="navbar bg-red">
        <div class="container-fluid">
            <a class="navbar-brand navbar-brand-custom d-flex align-items-center" href="../BSHOME/index.html">
                <img src="ruta-del-logo.png" alt="Logo" width="34" height="40" class="d-inline-block align-text-top me-2">
                <span class="text-center brand-text-black">Mundo Velas</span>
            </a>
        </div>
    </nav>

    <!-- Resultado -->
    <div class="container">
        <div id="result-card" class="result-card">
            <div class="spinner-border text-danger" style="width: 3rem; height: 3rem;" role="status"></div>
            <h3 class="mt-4">Verificando tu pago...</h3>
            <p class="text-muted">Por favor espera, estamos confirmando la transacción con Wompi.</p>
        </div>
    </div>

<script>
    function getQueryParam(param) {
        const urlParams = new URLSearchParams(window.location.search);
        return urlParams.get(param);
    }

    document.addEventListener('DOMContentLoaded', async () => {
        const transactionId = getQueryParam('id');
        const resultCard = document.getElementById('result-card');

        if (!transactionId) {
            resultCard.innerHTML = `
                <i class="fas fa-exclamation-triangle icon-error"></i>
                <h2>No se encontró la transacción</h2>
                <a href="../BSCART/index.html" class="btn btn-danger mt-3">Volver al carrito</a>
            `;
            return;
        }

        // Mostramos un spinner mientras consultamos a Wompi
        resultCard.innerHTML = `
            <div class="spinner-border text-danger" style="width: 3rem; height: 3rem;" role="status"></div>
            <h3 class="mt-4">Verificando tu pago...</h3>
        `;

        try {
            // ✅ LLAMAMOS A NUESTRO BACKEND PARA VERIFICAR EL PAGO REAL
            const verifyResponse = await fetch(`https://mundo-velas-api.onrender.com/api/orders/verify/${transactionId}`);
            const verifyData = await verifyResponse.json();

            if (!verifyData.success) {
                throw new Error('No se pudo verificar la transacción');
            }

            const isRejected = !verifyData.isApproved; // Si no está aprobada, es rechazada

            if (isRejected) {
                // PAGO RECHAZADO
                resultCard.innerHTML = `
                    <i class="fas fa-times-circle icon-error"></i>
                    <h2>Pago Rechazado</h2>
                    <p class="text-muted">Lo sentimos, tu transacción no pudo ser completada.</p>
                    <hr>
                    <p><strong>ID de Transacción:</strong> ${transactionId}</p>
                    <p><strong>Estado:</strong> <span class="badge bg-danger">${verifyData.status}</span></p>
                    <div class="mt-4">
                        <a href="../BSCART/index.html" class="btn btn-danger w-100">Intentar de nuevo</a>
                    </div>
                `;
            } else {
                // PAGO EXITOSO
                const token = localStorage.getItem('token');
                if (token) {
                    // Guardamos la orden en la base de datos
                    await fetch('https://mundo-velas-api.onrender.com/api/orders', {
                        method: 'POST',
                        headers: {
                            'Content-Type': 'application/json',
                            'Authorization': `Bearer ${token}`
                        },
                        body: JSON.stringify({ transactionId: transactionId })
                    });
                    if (window.updateCartCounter) window.updateCartCounter();
                }

                resultCard.innerHTML = `
                    <i class="fas fa-check-circle icon-success"></i>
                    <h2>¡Pago Exitoso!</h2>
                    <p class="text-muted">Gracias por tu compra en Mundo Velas.</p>
                    <hr>
                    <p><strong>ID de Transacción:</strong> ${transactionId}</p>
                    <p><strong>Estado:</strong> <span class="badge bg-success">APROBADO</span></p>
                    <div class="mt-4">
                        <a href="../BSUSERPAGE/orders.html" class="btn btn-outline-danger w-100 mb-2">Ver mis compras</a>
                        <a href="../BSHOME/index.html" class="btn btn-danger w-100">Volver al Inicio</a>
                    </div>
                `;
            }
        } catch (error) {
            console.error('Error:', error);
            resultCard.innerHTML = `<h2>Error al verificar el pago</h2>`;
        }
    });
</script>
