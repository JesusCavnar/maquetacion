<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mundo Velas - Registrarse</title>
    <!-- Bootstrap CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-QWTKZyjpPEjISv5WaRU9OFeRpok6YctnYmDr5pNlyT2bRjXh0JMhjY6hW+ALEwIH" crossorigin="anonymous">
    <!-- Font Awesome for icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    
    <style>
        :root {
            --primary-red: #ff0000;
            --dark-red: #cc0000;
            --light-bg: #f8f9fa;
        }
        
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #fff5f5 0%, #dba1a1 100%);
            min-height: 100vh;
            display: flex;
            flex-direction: column;
        }
        
        .bg-red {
            background-color: var(--primary-red);
        }
        
        .navbar-nav .nav-link {
            margin-right: 20px;
        }
        
        .navbar-brand-custom {
            margin-left: 43%;
        }
        
        @media (max-width: 768px) {
            .navbar-brand-custom {
                margin-left: 0;
            }
        }
        
        /* Content and signup container */
        .content {
            flex: 1;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
        }
        
        .signup-container {
            background: rgba(255, 255, 255, 0.95);
            padding: 30px;
            border-radius: 15px;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.1);
            width: 100%;
            max-width: 500px;
            position: relative;
            overflow: hidden;
        }
        
        .signup-container::before {
            content: '';
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 5px;
            background: linear-gradient(90deg, var(--primary-red), var(--dark-red));
        }
        
        .signup-header {
            text-align: center;
            margin-bottom: 25px;
            color: var(--primary-red);
            font-weight: 600;
            position: relative;
            padding-bottom: 10px;
        }
        
        .signup-header::after {
            content: '';
            position: absolute;
            bottom: 0;
            left: 50%;
            transform: translateX(-50%);
            width: 50px;
            height: 3px;
            background: var(--primary-red);
            border-radius: 2px;
        }
        
        .candle-decoration {
            text-align: center;
            margin-bottom: 20px;
            color: #ff6666;
            font-size: 40px;
        }
        
        .form-control {
            border-radius: 8px;
            padding: 12px 15px;
            border: 1px solid #ddd;
            transition: all 0.3s;
            margin-bottom: 15px;
        }
        
        .form-control:focus {
            border-color: var(--primary-red);
            box-shadow: 0 0 8px rgba(255, 0, 0, 0.3);
        }
        
        .form-label {
            font-weight: 500;
            margin-bottom: 8px;
            color: #555;
        }
        
        .btn-primary {
            background: linear-gradient(to right, var(--primary-red), var(--dark-red));
            border: none;
            border-radius: 8px;
            padding: 12px;
            font-weight: 600;
            transition: all 0.3s;
            box-shadow: 0 4px 10px rgba(255, 0, 0, 0.2);
        }
        
        .btn-primary:hover {
            background: linear-gradient(to right, var(--dark-red), #b30000);
            transform: translateY(-2px);
            box-shadow: 0 6px 15px rgba(255, 0, 0, 0.3);
        }
        
        .input-group .form-select {
            border-radius: 8px 0 0 8px;
            border-right: none;
        }
        
        .input-group .form-control {
            border-radius: 0 8px 8px 0;
        }
        
        .input-group .form-select:focus,
        .input-group .form-control:focus {
            z-index: 3; /* Ensure focus states work properly */
        }
        
        .login-link {
            margin-top: 20px;
            text-align: center;
            padding-top: 15px;
            border-top: 1px solid #eee;
        }
        
        .login-link p {
            margin-bottom: 0;
            color: #666;
        }
        
        .login-link .btn-outline-danger {
            border-radius: 8px;
            padding: 6px 15px;
            font-weight: 500;
            transition: all 0.3s;
        }
        
        .login-link .btn-outline-danger:hover {
            transform: translateY(-1px);
            box-shadow: 0 4px 8px rgba(255, 0, 0, 0.2);
        }
        
        .password-toggle {
            position: absolute;
            right: 15px;
            top: 50%;
            transform: translateY(-50%);
            background: none;
            border: none;
            color: #777;
            cursor: pointer;
            z-index: 5;
        }
        
        .password-container {
            position: relative;
        }
        
        .form-note {
            font-size: 0.85rem;
            color: #666;
            margin-top: -10px;
            margin-bottom: 15px;
        }
    </style>
</head>
<body>

    <!-- Navbar superior -->
    <nav class="navbar bg-red">
        <div class="container-fluid d-flex justify-content-between align-items-center">
          <a class="navbar-brand navbar-brand-custom d-flex align-items-center" href="#">
            <img src="ruta-del-logo.png" alt="Logo" width="34" height="40" class="d-inline-block align-text-top me-2">
            <span class="text-center text-black">Mundo Velas</span>
          </a>
    </nav>

    <!-- Navbar inferior -->
    <nav class="navbar navbar-expand-lg bg-body-tertiary">
        <div class="container-fluid">
          <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarNavAltMarkup" aria-controls="navbarNavAltMarkup" aria-expanded="false" aria-label="Toggle navigation">
            <span class="navbar-toggler-icon"></span>
          </button>
          <div class="collapse navbar-collapse justify-content-center" id="navbarNavAltMarkup">
            <div class="navbar-nav">
              <a class="nav-link" href="../BSHOME/homemain.html">Inicio</a>
              <a class="nav-link" href="../BSLOGIN/index2.html">Iniciar Sesión</a>
            </div>
          </div>
        </div>
    </nav>

    <!-- Sign up content -->
    <div class="content">
        <div class="signup-container">
            <div class="candle-decoration">
                <i class="fas fa-candle-holder"></i>
            </div>
            <h2 class="signup-header">Crear Cuenta</h2>
            
            <!-- Sign up form -->
            <form id="signupForm">
                <div class="mb-3">
                    <label for="firstName" class="form-label">Nombre</label>
                    <input type="text" class="form-control" id="firstName" placeholder="Ingrese su nombre" required>
                </div>
                <div class="mb-3">
                    <label for="lastName" class="form-label">Apellido</label>
                    <input type="text" class="form-control" id="lastName" placeholder="Ingrese su apellido" required>
                </div>
                <div class="mb-3">
                    <label for="email" class="form-label">Email</label>
                    <input type="email" class="form-control" id="email" placeholder="Ingrese su email" required>
                </div>
                <div class="mb-3 password-container">
                    <label for="password" class="form-label">Contraseña</label>
                    <input type="password" class="form-control" id="password" placeholder="Cree una contraseña" required>
                    <button type="button" class="password-toggle" id="togglePassword" aria-label="Show or hide password">
                        <i class="far fa-eye"></i>
                    </button>
                    <div class="form-note">Usa al menos 8 caracteres con una mezcla de letras y números</div>
                </div>
                <div class="mb-3">
                    <label for="phone" class="form-label">Número de Teléfono</label>
                    <div class="input-group">
                        <select class="form-select" id="areaCode" aria-label="Area Code">
                            <option selected value="+1">+1 (US/Canada)</option>
                            <option value="+44">+44 (UK)</option>
                            <option value="+33">+33 (France)</option>
                            <option value="+52">+52 (Mexico)</option>
                            <option value="+57">+57 (Colombia)</option>
                            <option value="+91">+91 (India)</option>
                        </select>
                        <input type="text" class="form-control" id="phone" placeholder="Ingrese el número de teléfono" required>
                    </div>
                </div>
                <div class="d-grid">
                    <button type="submit" class="btn btn-primary">Crear Cuenta</button>
                </div>
            </form>

            <!-- Login link -->
            <div class="text-center login-link">
                <p>Ya tienes una cuenta? <a href="../BSLOGIN/index2.html" class="btn btn-outline-danger">Iniciar Sesión</a></p>
            </div>
        </div>
    </div>

    <!-- Bootstrap JS -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js" integrity="sha384-wxMN3w20azU+96oH1fER0U+xW+Yzo9nncJLe4WqxIehVRy0ihgUhrT4GcVoJgbFw" crossorigin="anonymous"></script>
    
    <script>
        // Toggle password visibility
        document.addEventListener('DOMContentLoaded', function() {
            const togglePassword = document.getElementById('togglePassword');
            const passwordInput = document.getElementById('password');
            
            if (togglePassword && passwordInput) {
                togglePassword.addEventListener('click', function() {
                    const type = passwordInput.getAttribute('type') === 'password' ? 'text' : 'password';
                    passwordInput.setAttribute('type', type);
                    
                    // Toggle eye icon
                    this.innerHTML = type === 'password' ? '<i class="far fa-eye"></i>' : '<i class="far fa-eye-slash"></i>';
                });
            }
        });
    </script>
    
    <!-- Sign up JS -->
    <script type="module" src="../js/signup.js"></script>
</body>
</html>
