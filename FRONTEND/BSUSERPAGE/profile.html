<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>User Profile - Mundo Velas</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        .profile-container {
            max-width: 600px;
            margin: 0 auto;
            padding: 20px;
            border: 1px solid #ddd;
            border-radius: 8px;
            background-color: #f9f9f9;
        }
        .profile-container h2 {
            text-align: center;
            margin-bottom: 20px;
        }
        .profile-photo {
            width: 150px;
            height: 150px;
            border-radius: 50%;
            object-fit: cover;
            margin: 0 auto 20px;
            display: block;
        }
        .bg-red {
            background-color: #ff0000; /* Color rojo */
        }
        .navbar-nav .nav-link {
            margin-right: 20px; /* Espaciado entre las opciones del Navbar */
        }
        .navbar-brand-custom {
            margin-left: 43%; /* Ajuste de centrado para el título */
        }
    </style>
</head>
<body>

    <!-- Navbar superior -->
    <nav class="navbar bg-red">
        <div class="container-fluid d-flex justify-content-between align-items-center">
            <a class="navbar-brand navbar-brand-custom d-flex align-items-center" href="#" data-home>
                <img src="ruta-del-logo.png" alt="Logo" width="34" height="40" class="d-inline-block align-text-top me-2">
                <span class="text-center">Mundo Velas</span>
            </a>
            <a class="navbar-brand ms-auto profile-link" href="#"><img src="ruta-del-icono-perfil.png" alt="Profile" width="30" height="30"></a>
        </div>
    </nav>
    
    <!-- Navbar inferior -->
    <nav class="navbar navbar-expand-lg bg-body-tertiary">
        <div class="container-fluid">
            <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarNavAltMarkup" aria-controls="navbarNavAltMarkup" aria-expanded="false" aria-label="Toggle navigation">
                <span class="navbar-toggler-icon"></span>
            </button>
            <div class="collapse navbar-collapse justify-content-center" id="navbarNavAltMarkup">
                <div class="navbar-nav">
               <a class="nav-link" href="../BSHOMEUSER/index.html">Home</a>
              <a class="nav-link" href="../BSUSERPAGE/profile.html">My Profile</a>
              <a class="nav-link" href="../BSFAVORITES/favorites.html">Favorites</a>
            </div>
          </div>
        </div>
    </nav>

    <!-- Include navigation script -->
   <script src="../js/nav.js"></script>

    <!-- Profile Content -->
    <div class="profile-container">
        <h2 id="welcome-message">User Profile</h2>
        <img src="placeholder-profile-photo.png" alt="Profile Photo" class="profile-photo">
        
        <!-- Display Current User Information -->
        <div id="user-info">
            <p><strong>First Name:</strong> <span id="current-firstName"></span></p>
            <p><strong>Last Name:</strong> <span id="current-lastName"></span></p>
            <p><strong>Email:</strong> <span id="current-email"></span></p>
            <p><strong>Phone:</strong> <span id="current-phone"></span></p>
        </div>

        <!-- Update User Information Form -->
        <form id="updateProfileForm">
            <div class="mb-3">
                <label for="firstName" class="form-label">First Name</label>
                <input type="text" class="form-control" id="firstName" required>
            </div>
            <div class="mb-3">
                <label for="lastName" class="form-label">Last Name</label>
                <input type="text" class="form-control" id="lastName" required>
            </div>
            <div class="mb-3">
                <label for="email" class="form-label">Email</label>
                <input type="email" class="form-control" id="email" required>
            </div>
            <div class="mb-3">
                <label for="phone" class="form-label">Phone</label>
                <input type="text" class="form-control" id="phone" required>
            </div>
            <div class="mb-3">
                <label for="profilePhoto" class="form-label">Profile Photo</label>
                <input type="file" class="form-control" id="profilePhoto">
            </div>
            <button type="submit" class="btn btn-danger w-100">Update Profile</button>
       
            <!-- Add this button below the Update Profile form -->
            <div class="d-grid mt-3">
                <button type="button" class="btn btn-danger" id="deleteProfileButton">Delete Profile</button>
            </div>
        
        </form>
    </div>

    <script src="../js/profile.js"></script>
</body>
</html>
