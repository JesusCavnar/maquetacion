<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mundo Velas - Inicio de sesión</title>
    <!-- Bootstrap CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <!-- Font Awesome for icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            overflow-x: hidden;
        }
        
        /* Background Slideshow */
        .slideshow-container {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: -1;
            overflow: hidden;
        }
        
        .slide {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            opacity: 0;
            transition: opacity 1.5s ease-in-out;
            background-size: cover;
            background-position: center;
            background-repeat: no-repeat;
        }
        
        .slide.active {
            opacity: 1;
        }
        
        .slide::after {
            content: '';
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0, 0, 0, 0.4);
        }
        
        /* Navbar styles */
        .bg-red {
            background-color: #ff0000;
        }
        
        .navbar-nav .nav-link {
            margin-right: 20px;
        }
        
        .navbar-brand-custom {
            margin-left: 43%;
        }
        
        @media (max-width: 768px) {
            .navbar-brand-custom {
                margin-left: 0;
            }
        }
        
        /* Content and login container */
        .content {
            flex: 1;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
            position: relative;
            z-index: 1;
        }
        
        .login-container {
            background: rgba(255, 255, 255, 0.95);
            padding: 30px;
            border-radius: 15px;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.2);
            width: 100%;
            max-width: 450px;
            position: relative;
            overflow: hidden;
        }
        
        .login-container::before {
            content: '';
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 5px;
            background: linear-gradient(90deg, #ff0000, #ff6666);
        }
        
        .login-container h2 {
            text-align: center;
            margin-bottom: 25px;
            color: #ff0000;
            font-weight: 600;
            position: relative;
            padding-bottom: 10px;
        }
        
        .login-container h2::after {
            content: '';
            position: absolute;
            bottom: 0;
            left: 50%;
            transform: translateX(-50%);
            width: 50px;
            height: 3px;
            background: #ff0000;
            border-radius: 2px;
        }
        
        .form-control {
            border-radius: 8px;
            padding: 12px 15px;
            border: 1px solid #ddd;
            transition: all 0.3s;
            margin-bottom: 15px;
        }
        
        .form-control:focus {
            border-color: #ff0000;
            box-shadow: 0 0 8px rgba(255, 0, 0, 0.3);
        }
        
        .form-label {
            font-weight: 500;
            margin-bottom: 8px;
            color: #555;
        }
        
        .btn-primary {
            background: linear-gradient(to right, #ff0000, #ff5555);
            border: none;
            border-radius: 8px;
            padding: 12px;
            font-weight: 600;
            transition: all 0.3s;
            box-shadow: 0 4px 10px rgba(255, 0, 0, 0.2);
        }
        
        .btn-primary:hover {
            background: linear-gradient(to right, #cc0000, #ff3333);
            transform: translateY(-2px);
            box-shadow: 0 6px 15px rgba(255, 0, 0, 0.3);
        }
        
        .social-buttons {
            margin-top: 20px;
            position: relative;
            text-align: center;
        }
        
        .social-buttons::before {
            content: 'O continua con';
            position: absolute;
            top: -12px;
            left: 50%;
            transform: translateX(-50%);
            background: white;
            padding: 0 15px;
            color: #777;
            font-size: 14px;
        }
        
        .social-buttons .btn {
            border-radius: 8px;
            padding: 10px;
            font-weight: 500;
            transition: all 0.3s;
            margin-bottom: 10px;
            display: flex;
            align-items: center;
            justify-content: center;
        }
        
        .social-buttons .btn i {
            margin-right: 10px;
            font-size: 18px;
        }
        
        .social-buttons .btn-google {
            background-color: #fff;
            color: #444;
            border: 1px solid #ddd;
        }
        
        .social-buttons .btn-google:hover {
            background-color: #f8f9fa;
            box-shadow: 0 4px 8px rgba(0, 0, 0, 0.1);
        }
        
        .signup-button {
            margin-top: 20px;
            text-align: center;
            padding-top: 15px;
            border-top: 1px solid #eee;
        }
        
        .signup-button p {
            margin-bottom: 0;
            color: #666;
        }
        
        .signup-button .btn-outline-danger {
            border-radius: 8px;
            padding: 6px 15px;
            font-weight: 500;
            transition: all 0.3s;
        }
        
        .signup-button .btn-outline-danger:hover {
            transform: translateY(-1px);
            box-shadow: 0 4px 8px rgba(255, 0, 0, 0.2);
        }
        
        .password-toggle {
            position: absolute;
            right: 15px;
            top: 50%;
            transform: translateY(-50%);
            background: none;
            border: none;
            color: #777;
            cursor: pointer;
        }
        
        .password-container {
            position: relative;
        }
        
        .candle-decoration {
            text-align: center;
            margin-bottom: 20px;
            color: #ff6666;
            font-size: 40px;
        }
    </style>
</head>
<body>

    <!-- Background Slideshow -->
    <div class="slideshow-container">
        <!-- Replace these image URLs with your own JPG files -->
        <div class="slide active" style="background-image: url('background4.jpg');"></div>
        <div class="slide" style="background-image: url('background.jpg');"></div>
        <div class="slide" style="background-image: url('background2.jpg');"></div>
        <div class="slide" style="background-image: url('background3.jpg');"></div>
    </div>

    <!-- Navbar superior -->
    <nav class="navbar bg-red">
        <div class="container-fluid d-flex justify-content-between align-items-center">
          <a class="navbar-brand navbar-brand-custom d-flex align-items-center" href="#">
            <img src="ruta-del-logo.png" alt="Logo" width="34" height="40" class="d-inline-block align-text-top me-2">
            <span class="text-center text-dark">Mundo Velas</span> <!-- Changed to black text -->
          </a>
        </div>
    </nav>
    
    <!-- Navbar inferior -->
    <nav class="navbar navbar-expand-lg bg-body-tertiary">
        <div class="container-fluid">
          <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarNavAltMarkup" aria-controls="navbarNavAltMarkup" aria-expanded="false" aria-label="Toggle navigation">
            <span class="navbar-toggler-icon"></span>
          </button>
          <div class="collapse navbar-collapse justify-content-center" id="navbarNavAltMarkup">
            <div class="navbar-nav">
              <a class="nav-link" href="../BSHOME/homemain.html">Inicio</a>
            </div>
          </div>
        </div>
    </nav>

    <!-- Contenido principal con el formulario -->
    <div class="content">
        <div class="login-container">
            <div class="candle-decoration">
                <i class="fas fa-candle-holder"></i>
            </div>
            <h2>Iniciar Sesión</h2>
            <form id="loginForm">
                <div class="mb-3">
                    <label for="email" class="form-label">Dirección de Email</label>
                    <input type="email" class="form-control" id="email" placeholder="Ingrese su email" required>
                </div>
                <div class="mb-3 password-container">
                    <label for="password" class="form-label">Contraseña</label>
                    <input type="password" class="form-control" id="password" placeholder="Ingrese su contraseña" required>
                    <button type="button" class="password-toggle" id="togglePassword" aria-label="Show or hide password">
                        <i class="far fa-eye"></i>
                    </button>
                </div>
                <button type="submit" class="btn btn-primary w-100">Iniciar Sesión</button>
            </form>

            <!-- Google Sign-In Button -->
            <div class="social-buttons text-center">
                <button id="google-signin-button" class="btn btn-google w-100 mb-2">
                    <i class="fab fa-google"></i> Iniciar sesión con Google
                </button>
            </div>

            <!-- Botón de Sign Up -->
            <div class="text-center signup-button">
                <p>No tienes una cuenta? <a href="../BSSIGNUP/index2.html" class="btn btn-outline-danger">Registrarse</a></p>
            </div>
        </div>
    </div>

    <script>
        // Handle normal sign-in form submission
        document.getElementById('loginForm').addEventListener('submit', async function(event) {
            event.preventDefault();
            
            const emailInput = document.getElementById('email');
            const passwordInput = document.getElementById('password');
            
            // Simple validation
            if (!emailInput.value || !passwordInput.value) {
                alert('Please enter both email and password');
                return;
            }

            try {
                const response = await fetch('https://mundo-velas-api.onrender.com/api/users/login', {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json',
                    },
                    body: JSON.stringify({ 
                        email: emailInput.value, 
                        password: passwordInput.value 
                    })
                });

                // First check if response is ok
                if (!response.ok) {
                    const errorData = await response.json();
                    throw new Error(errorData.message || 'Login failed');
                }

                const data = await response.json();
                
                // Store the token and user data
                localStorage.setItem('token', data.token);
                localStorage.setItem('user', JSON.stringify(data.user));
                localStorage.setItem('loginMethod', 'manual');
                
                // Redirect to profile page
                window.location.href = '../BSHOME/index.html';
                
            } catch (error) {
                console.error('Login error:', error);
                alert(error.message || 'Login failed. Please try again.');
            }
        });

        // Toggle password visibility
        const togglePassword = document.getElementById('togglePassword');
        const passwordInput = document.getElementById('password');
        
        togglePassword.addEventListener('click', function() {
            const type = passwordInput.getAttribute('type') === 'password' ? 'text' : 'password';
            passwordInput.setAttribute('type', type);
            
            // Toggle eye icon
            this.innerHTML = type === 'password' ? '<i class="far fa-eye"></i>' : '<i class="far fa-eye-slash"></i>';
        });

        // Background slideshow functionality
        document.addEventListener('DOMContentLoaded', function() {
            const slides = document.querySelectorAll('.slide');
            let currentSlide = 0;
            
            function nextSlide() {
                slides[currentSlide].classList.remove('active');
                currentSlide = (currentSlide + 1) % slides.length;
                slides[currentSlide].classList.add('active');
            }
            
            // Change slide every 5 seconds
            setInterval(nextSlide, 5000);
        });
    </script>

    <!-- Firebase Script -->

      import { getAuth, GoogleAuthProvider, signInWithPopup } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-auth.js";

        authDomain: "mundovelas-f2aa9.firebaseapp.com",
        projectId: "mundovelas-f2aa9",
        storageBucket: "mundovelas-f2aa9.firebasestorage.app",
        messagingSenderId: "976188484759",
        appId: "1:976188484759:web:35cd9ae5ded07320ec8dd2",
        measurementId: "G-HGJM3K8MKJ"
      };

      // Initialize Firebase
      const app = initializeApp(firebaseConfig);
      const auth = getAuth(app);

      console.log("Firebase initialized:", app); // Check if Firebase is initialized

      // Handle Google Sign-In
    const googleSignInButton = document.getElementById('google-signin-button');
     googleSignInButton.addEventListener('click', async () => {
    console.log("Google Sign-In button clicked"); // Check if the button click is registered

    const provider = new GoogleAuthProvider();
    try {
        const result = await signInWithPopup(auth, provider);
        console.log("Google Sign-In successful:", result.user); // Check if sign-in is successful
        const user = result.user;

        // Get the Firebase ID token
        const idToken = await user.getIdToken();
        console.log("Firebase ID token:", idToken); // Log the token to the console

        // Save user data to localStorage
        localStorage.setItem('token', idToken); // Store the Firebase ID token
        localStorage.setItem('user', JSON.stringify(user));
        localStorage.setItem('loginMethod', 'google'); // Store the login method

        // Send the ID token to your backend
        const response = await fetch('https://mundo-velas-api.onrender.com/api/users/google-signin', {
            method: 'POST',
            headers: {
                'Content-Type': 'application/json',
            },
            body: JSON.stringify({ idToken }), // Send the Firebase ID token
        });

        const data = await response.json();
        console.log('Google sign-in response:', data);

        // Redirect to the profile page
        window.location.href = '../BSHOME/index.html';
    } catch (error) {
        console.error('Google Sign-In error:', error); // Log any errors
        alert('Google Sign-In failed. Please try again.');
    }
     });
    </script>

    <!-- Bootstrap JS -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
