<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mundo Velas - Sign Up</title>
    <!-- Bootstrap CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-QWTKZyjpPEjISv5WaRU9OFeRpok6YctnYmDr5pNlyT2bRjXh0JMhjY6hW+ALEwIH" crossorigin="anonymous">
    
    <style>
        .bg-red {
            background-color: #ff0000; /* Color rojo */
        }
        .navbar-nav .nav-link {
            margin-right: 20px; /* Espaciado entre las opciones del Navbar */
        }
        .navbar-brand-custom {
            margin-left: 42%; /* Ajuste de centrado para el título */
        }
        .signup-header {
            margin: 20px 0; 
            text-align: center; 
        }
        .signup-form {
            max-width: 600px;
            margin: 0 auto; 
            padding: 20px;
            border: 1px solid #ddd;
            border-radius: 8px;
        }
    </style>
</head>
<body>

    <!-- Navbar superior -->
    <nav class="navbar bg-red">
        <div class="container-fluid d-flex justify-content-between align-items-center">
          <a class="navbar-brand navbar-brand-custom d-flex align-items-center" href="#">
            <img src="ruta-del-logo.png" alt="Logo" width="34" height="40" class="d-inline-block align-text-top me-2">
            <span class="text-center">Mundo Velas</span>
          </a>
          <a class="navbar-brand ms-auto" href="#"><img src="ruta-del-icono-perfil.png" alt="Profile" width="30" height="30"></a>
        </div>
    </nav>

    <!-- Navbar inferior -->
    <nav class="navbar navbar-expand-lg bg-body-tertiary">
        <div class="container-fluid">
          <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarNavAltMarkup" aria-controls="navbarNavAltMarkup" aria-expanded="false" aria-label="Toggle navigation">
            <span class="navbar-toggler-icon"></span>
          </button>
          <div class="collapse navbar-collapse justify-content-center" id="navbarNavAltMarkup">
            <div class="navbar-nav">
              <a class="nav-link" href="#">Home</a>
              <a class="nav-link" href="#">Candles</a>
              <a class="nav-link" href="#">Essence</a>
              <a class="nav-link" href="#">Gift Sets</a>
              <a class="nav-link" href="#">Mission and Goals</a>
              <a class="nav-link" href="#">About Us</a>
            </div>
          </div>
        </div>
    </nav>

    <!-- Sign up header -->
    <h2 class="signup-header">Sign up</h2>

    <!-- Sign up form -->
    <form class="signup-form" id="signupForm">
        <div class="mb-3">
            <label for="firstName" class="form-label">First Name</label>
            <input type="text" class="form-control" id="firstName" placeholder="Enter your first name" required>
        </div>
        <div class="mb-3">
            <label for="lastName" class="form-label">Last Name</label>
            <input type="text" class="form-control" id="lastName" placeholder="Enter your last name" required>
        </div>
        <div class="mb-3">
            <label for="email" class="form-label">Email</label>
            <input type="email" class="form-control" id="email" placeholder="Enter your email" required>
        </div>
        <div class="mb-3">
            <label for="password" class="form-label">Password</label>
            <input type="password" class="form-control" id="password" placeholder="Enter your password" required>
        </div>
        <div class="mb-3">
            <label for="phone" class="form-label">Phone</label>
            <div class="input-group">
                <select class="form-select" id="areaCode" aria-label="Area Code">
                    <option selected value="+1">+1 (US/Canada)</option>
                    <option value="+44">+44 (UK)</option>
                    <option value="+33">+33 (France)</option>
                    <option value="+52">+52 (Mexico)</option>
                    <option value="+57">+57 (Colombia)</option>
                    <option value="+91">+91 (India)</option>
                </select>
                <input type="text" class="form-control" id="phone" placeholder="Enter phone number" required>
            </div>
        </div>
        <div class="d-grid">
            <button type="submit" class="btn btn-danger">Sign up</button>
        </div>
    </form>

    <!-- Bootstrap JS -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js" integrity="sha384-wxMN3w20azU+96oH1fER0U+xW+Yzo9nncJLe4WqxIehVRy0ihgUhrT4GcVoJgbFw" crossorigin="anonymous"></script>
    <!-- Sign up JS -->
    <script type="module" src="../js/signup.js"></script>
</body>
</html>
